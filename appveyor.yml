version: '#{build}-{branch}'
image: Visual Studio 2017

configuration: Release

environment:
  matrix:
    - PlatformToolset: v141_xp

install:
  - git submodule update --init --recursive

# One job, not a `platform:` matrix: a matrix means one signing login per job. See ci/SIGNING.md.
# /logger is what the built-in `build:` step gave us - warnings and errors on the Messages tab.
build_script:
  - cmd: msbuild src\WindowsHookEx.sln /p:Configuration=Release /p:Platform=x86 /m /v:minimal /logger:"C:\Program Files\AppVeyor\BuildAgent\Appveyor.MSBuildLogger.dll"
  - cmd: msbuild src\WindowsHookEx.sln /p:Configuration=Release /p:Platform=x64 /m /v:minimal /logger:"C:\Program Files\AppVeyor\BuildAgent\Appveyor.MSBuildLogger.dll"

after_build:
  # Sign before zipping. No-op on non-tag builds. See ci/SIGNING.md.
  - ps: >-
      .\ci\appveyor-sign.ps1
      -Path "src\bin\WindowsHookEx-x86.exe", "src\bin\HookDll-x86.dll",
      "src\bin\WindowsHookEx-x64.exe", "src\bin\HookDll-x64.dll"

  # Absolute paths, so 7z stores bare filenames.
  - cmd: >-
      7z a WindowsHookEx-x86.zip
      %APPVEYOR_BUILD_FOLDER%\src\bin\WindowsHookEx-x86.exe %APPVEYOR_BUILD_FOLDER%\src\bin\WindowsHookEx-x86.pdb
      %APPVEYOR_BUILD_FOLDER%\src\bin\HookDll-x86.dll %APPVEYOR_BUILD_FOLDER%\src\bin\HookDll-x86.pdb
  - cmd: >-
      7z a WindowsHookEx-x64.zip
      %APPVEYOR_BUILD_FOLDER%\src\bin\WindowsHookEx-x64.exe %APPVEYOR_BUILD_FOLDER%\src\bin\WindowsHookEx-x64.pdb
      %APPVEYOR_BUILD_FOLDER%\src\bin\HookDll-x64.dll %APPVEYOR_BUILD_FOLDER%\src\bin\HookDll-x64.pdb

test: off

artifacts:
  - path: WindowsHookEx-x86.zip
    name: WindowsHookEx-x86
  - path: WindowsHookEx-x64.zip
    name: WindowsHookEx-x64

skip_commits:
  files:
    - docs/*
    - '**/*.html'

deploy:
  - provider: GitHub
    # Padlocked variables in the AppVeyor project settings; SIGNING_NOTES is set by ci/signing-status.ps1.
    auth_token: $(GITHUB_AUTH_TOKEN)
    description: $(SIGNING_NOTES)
    draft: true
    on:
      APPVEYOR_REPO_TAG: true
